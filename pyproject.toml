[project]
name = "salary-predictor"
version = "0.1.0"
description = "Salary prediction app for data science roles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "plotly>=5.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "supabase>=2.3.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "httpx>=0.27.0",
    "isort>=5.13.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salary_predictor"]